# Include alongside the public banas.dev virtual host.
# The public HTTPS server uses the same root directive:
# root /var/lib/banasdev/current/public;
server {
    listen 127.0.0.1:18081;
    server_name localhost;
    root /var/lib/banasdev/current/public;
    location / { try_files $uri =404; }
}
