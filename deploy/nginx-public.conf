# Content negotiation is origin-side; no paid Cloudflare feature is required.
map $http_accept $banasdev_page_ext {
    default ".html";
    "~*(^|,)\\s*text/markdown\\s*;\\s*q=0(\\.0*)?\\s*(,|$)" ".html";
    "~*(^|,)\\s*text/markdown(\\s*;[^,]*)?\\s*(,|$)" ".md";
}
map $request_uri $banasdev_page_cache {
    default "";
    "~^/(index\\.html|projekty\\.html|hobby\\.html)?(\\?|$)" "no-store";
}

# Przekierowanie HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name banas.dev www.banas.dev;
    return 301 https://banas.dev$request_uri;
}

# Główna konfiguracja HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name banas.dev www.banas.dev;

    root /var/lib/banasdev/current/public;
    index index.html;

    # Cloudflare can forward an HTTP visitor request over HTTPS to the origin.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://banas.dev$request_uri;
    }
    if ($host = "www.banas.dev") {
        return 301 https://banas.dev$request_uri;
    }

    # Nowe certyfikaty Wildcard
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.key;

    # Start HSTS on this host only. Increase max-age after edge verification.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Vary "Accept" always;
    add_header Cache-Control $banasdev_page_cache always;

    # Keep canonicalization in Nginx so immutable application releases retain it.
    location ~ ^/(index\.html)?$ {
        # Nginx does not inherit parent add_header when a location adds Link.
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Vary "Accept" always;
        add_header Cache-Control $banasdev_page_cache always;
        add_header Link '<https://banas.dev/>; rel="canonical", </.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json", </api.md>; rel="service-doc"; type="text/markdown", </index.md>; rel="describedby"; type="text/markdown"' always;
        types { text/html html; text/markdown md; }
        try_files /index$banasdev_page_ext =404;
    }

    location ~ ^/(?<banasdev_page>projekty|hobby)\.html$ {
        types { text/html html; text/markdown md; }
        try_files /$banasdev_page$banasdev_page_ext =404;
    }

    location = /.well-known/api-catalog {
        types {}
        default_type application/linkset+json;
        try_files $uri =404;
    }

    location = /openapi.json {
        types {}
        default_type application/vnd.oai.openapi+json;
        try_files $uri =404;
    }

    location ~ \.md$ {
        types {}
        default_type text/markdown;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
