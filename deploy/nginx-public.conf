# Przekierowanie HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name banas.dev www.banas.dev;
    return 301 https://banas.dev$request_uri;
}

# Główna konfiguracja HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name banas.dev www.banas.dev;

    root /var/lib/banasdev/current/public;
    index index.html;

    # Cloudflare can forward an HTTP visitor request over HTTPS to the origin.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://banas.dev$request_uri;
    }
    if ($host = "www.banas.dev") {
        return 301 https://banas.dev$request_uri;
    }

    # Nowe certyfikaty Wildcard
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.key;

    # Start HSTS on this host only. Increase max-age after edge verification.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Keep canonicalization in Nginx so immutable application releases retain it.
    location ~ ^/(index\.html)?$ {
        # Nginx does not inherit parent add_header when a location adds Link.
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Link '<https://banas.dev/>; rel="canonical"' always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
